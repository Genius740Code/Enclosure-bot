[package]
name = "retaliator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
# cdylib is the WebAssembly module; rlib lets tests and harnesses use the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
meridian-engine = { path = "../vendor/meridian-bot-kit/engine" }
serde_json = "1"
ureq = "3"

[profile.release]
lto = true
codegen-units = 1

# Keeps this crate out of any enclosing Cargo workspace.
[workspace]
